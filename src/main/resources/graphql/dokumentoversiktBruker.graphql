query DokumentoversiktBruker(
  $id: String!
  $type: BrukerIdType!
  $tema: [Tema]
  $foerste: Int
) {
  dokumentoversiktBruker(
    brukerId: { id: $id, type: $type }
    tema: $tema
    foerste: $foerste
  ) {
    journalposter {
      journalpostId
      tittel
      journalposttype
      journalstatus
      tema
      eksternReferanseId
    }
    sideInfo {
      antall
      totaltAntall
    }
  }
}